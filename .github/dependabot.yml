version: 2
updates:
  - package-ecosystem: npm
    directory: /
    # Monthly: the work comes in through `develop` without PRs, so a weekly PR that
    # nobody looks at only piles up. The major-version ones (TypeScript, vitest, ESLint)
    # are applied by hand and one at a time; the minor ones, with `npm update`.
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    groups:
      # A single PR for the 3D block: three, R3F, drei and xr are coupled to each
      # other and updating them separately breaks types.
      three:
        patterns:
          - 'three'
          - '@types/three'
          - '@react-three/*'
      dev:
        dependency-type: development

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
