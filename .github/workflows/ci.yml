name: CI

# **Solo al publicar a `main`.** El trabajo entra por `develop` continuamente —cada tarea
# de un agente es un merge— y esto tarda veinte minutos por los e2e: correrlo ahí se comía
# la cuota de Actions de la organización en una semana. Lo que protege `main` es lo que
# importa, porque es lo que se despliega. Lo de `develop` ya lo verifican los gates que
# Organízate ejecuta sobre la rama antes de integrarla, en esta misma máquina y gratis.
#
# `workflow_dispatch` deja lanzarlo a mano desde GitHub sin tener que empujar nada.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Cancela ejecuciones antiguas de la misma rama: solo interesa la última.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Lint, tipos y unitarios
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # La versión exacta vive en `.nvmrc`: el formato del `package-lock.json`
          # cambia entre versiones de npm, así que el CI y quien desarrolla
          # tienen que usar exactamente la misma.
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      # Con el mínimo de cobertura del dominio (`vitest.config.mts`): los tests en
      # verde no dicen nada si la mitad del código no se ejecuta en ninguno.
      - run: npm run coverage

  e2e:
    name: Extremo a extremo
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Solo Chromium: la escena necesita WebGL y con --with-deps trae las
      # librerías de sistema que SwiftShader pide en el runner.
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
        env:
          CI: 'true'
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  audit:
    name: Dependencias
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Informativo: hoy hay avisos heredados de Next que no tienen versión
      # corregida publicada. Que no tumbe el CI, pero que se vean en el log.
      - run: npm audit --audit-level=critical

      # Guardián del lockfile: si `package.json` y `package-lock.json` se han
      # desincronizado, un install los reconcilia y reescribe el lock. Aquí eso
      # salta en vez de aparecer como ruido en el diff de otra tarea.
      #
      # Tiene que ser un install REAL. Con `--package-lock-only` daría falso
      # positivo: esa variante construye el árbol ideal completo y añade las
      # dependencias empaquetadas de paquetes opcionales de otras plataformas
      # (`@tailwindcss/oxide-wasm32-wasi`), que un install normal no escribe.
      #
      # Va después del `npm ci` de este job a propósito: reinstalar sobre un
      # árbol ya montado es lo que hace quien desarrolla, y es donde el
      # desajuste se nota.
      - name: El lockfile está sincronizado con package.json
        run: |
          npm install
          if ! git diff --exit-code package-lock.json; then
            echo "::error::Un install ha reescrito package-lock.json: está desincronizado con package.json. Ejecuta 'npm install' en local con la versión de Node de .nvmrc y commitea el lock."
            exit 1
          fi
