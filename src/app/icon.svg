<?xml version="1.0" encoding="UTF-8"?>
<!--
  Stick Rush icon: the machine's semicircular hoop seen from the front, with sticks hanging from
  it and one already dropping, in the xrcade palette (near-black background, mint accent for what
  is playable, warning yellow for the stick in flight). Flat shapes only, so it still reads at
  16 px, and the important part stays inside the central circle, because headsets and phones crop
  icons round.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <rect width="256" height="256" rx="56" fill="#0b0a12"/>
  <rect x="6" y="6" width="244" height="244" rx="50" fill="none" stroke="#2b2748" stroke-width="6"/>

  <!-- The hoop. -->
  <path d="M48 104a80 44 0 0 1 160 0" fill="none" stroke="#5ee6c0" stroke-width="14" stroke-linecap="round"/>

  <!-- The sticks still hanging from it. -->
  <rect x="74" y="69" width="12" height="72" rx="6" fill="#5ee6c0"/>
  <rect x="104" y="61" width="12" height="72" rx="6" fill="#5ee6c0"/>
  <rect x="170" y="69" width="12" height="72" rx="6" fill="#5ee6c0"/>

  <!-- The one that dropped, lower and slightly tilted. -->
  <rect x="140" y="128" width="12" height="72" rx="6" fill="#ffc24d" transform="rotate(8 146 164)"/>
  <!-- Motion lines above it. -->
  <rect x="134" y="96" width="6" height="18" rx="3" fill="#a6a1cc"/>
  <rect x="152" y="92" width="6" height="22" rx="3" fill="#a6a1cc"/>
</svg>
